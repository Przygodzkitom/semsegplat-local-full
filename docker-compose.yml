version: '3.8'

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  semseg-app:
    image: ghcr.io/przygodzkitom/semseg-app:latest
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - LABEL_STUDIO_URL=http://label-studio:8080
      - LABEL_STUDIO_USERNAME=${LABEL_STUDIO_USERNAME:-admin@example.com}
      - LABEL_STUDIO_PASSWORD=${LABEL_STUDIO_PASSWORD:-admin}
      - LABEL_STUDIO_PERSONAL_ACCESS_TOKEN=${LABEL_STUDIO_PERSONAL_ACCESS_TOKEN:-admin}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-segmentation-platform}
    volumes:
      - ./models/checkpoints:/app/models/checkpoints
      - ./label-studio-data:/app/label-studio-data
    depends_on:
      - label-studio
      - minio
    restart: unless-stopped

  label-studio:
    image: heartexlabs/label-studio:1.20.0
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/data
      - LABEL_STUDIO_DISABLE_UPDATE_CHECK=true
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-segmentation-platform}
    command: label-studio start --username admin@example.com --password admin
    volumes:
      - ./label-studio-data:/label-studio/data
    depends_on:
      - minio
    restart: unless-stopped
